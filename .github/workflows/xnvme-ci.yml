# The debs xNVMe's test images are assembled from: the server for the host,
# the ionic-ernic DKMS package for the guest, from one revision, so the two
# always match. cijoe does the work, as the workflows in
# packaging/xnvme-ci/cijoe, which run the same way outside GitHub; this only
# runs them and keeps their reports. A tag xnvme-ci/v<version>-<n> publishes
# the debs as a release.
#
# Copyright (c) Simon A. F. Lund <os@safl.dk>
# SPDX-License-Identifier: MIT
name: xnvme-ci

on:
  push:
    branches: ['xnvme-ci/**']
    tags: ['xnvme-ci/v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # The server on the hosts' release, the DKMS package on the guests'
  debs:
    strategy:
      fail-fast: false
      matrix:
        include:
        - {name: server, image: 'ubuntu:26.04'}
        - {name: dkms, image: 'ubuntu:26.10'}
    runs-on: ubuntu-24.04
    container: ${{ matrix.image }}
    steps:
    - run: apt-get -qy update && apt-get -qy install git pipx python3
    - uses: actions/checkout@v6
    - id: n
      env:
        REF_TYPE: ${{ github.ref_type }}
        REF_NAME: ${{ github.ref_name }}
      run: |
        if [ "$REF_TYPE" = tag ]; then
          base=$(python3 -c 'import re,pathlib; t=pathlib.Path("CMakeLists.txt").read_text(); print(".".join(re.search(rf"set\(ROCM_ERNIC_VERSION_{k}\s+(\d+)\)", t).group(1) for k in ("MAJOR","MINOR","PATCH")))')
          tag=${REF_NAME#xnvme-ci/v}
          [ "${tag%-*}" = "$base" ] || { echo "::error::tag $REF_NAME is not for $base"; exit 1; }
          echo "n=${tag##*-}"
        else
          echo "n=0"
        fi >> "$GITHUB_OUTPUT"
    - name: cijoe, ${{ matrix.name }}.yaml
      env:
        XNVME_CI_SRC: ${{ github.workspace }}
        XNVME_CI_OUT: ${{ github.workspace }}/out
        XNVME_CI_N: ${{ steps.n.outputs.n }}
      run: |
        pipx install --include-deps ./packaging/xnvme-ci/cijoe
        cd packaging/xnvme-ci/cijoe
        ~/.local/bin/cijoe workflows/${{ matrix.name }}.yaml --config configs/default.toml \
          --monitor --output "$GITHUB_WORKSPACE/cijoe-output"
    - uses: actions/upload-artifact@v6.0.0
      if: always()
      with:
        name: cijoe-report-${{ matrix.name }}
        path: cijoe-output/report.html
        if-no-files-found: warn
    - uses: actions/upload-artifact@v6.0.0
      with:
        name: debs-${{ matrix.name }}
        path: out/*.deb
        if-no-files-found: error

  release:
    if: github.ref_type == 'tag'
    needs: debs
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
    - uses: actions/download-artifact@v7.0.0
      with:
        pattern: debs-*
        path: debs
        merge-multiple: true
    - env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        cd debs
        sha256sum *.deb > SHA256SUMS
        cat SHA256SUMS
        gh release create "$TAG" -R "$GITHUB_REPOSITORY" --title "$TAG" \
          --notes "rocm-ernic server and ionic-ernic DKMS package from $GITHUB_SHA." \
          *.deb SHA256SUMS
